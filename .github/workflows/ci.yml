name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["data/raw/gbfs/**"]  # the collector commits every 10 min

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # data/processed and models/ are git-ignored: tests needing them skip
      - run: python -m pytest -q tests

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bikeshare-api .
      - run: docker run --rm bikeshare-api python -c "import src.api.main"
